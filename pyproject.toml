[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-pipeline-system"
version = "1.0.0"
description = "Autonomous, schema-adaptive Lakehouse data pipeline powered by PySpark, Delta Lake, Apache Airflow, Streamlit, and Model Context Protocol (MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dhruva S", email = "dhruvkuruvilla@gmail.com" }
]
keywords = [
    "data-engineering",
    "lakehouse",
    "delta-lake",
    "pyspark",
    "apache-spark",
    "apache-airflow",
    "self-healing",
    "data-quality",
    "mcp",
    "fastmcp",
    "model-context-protocol",
    "data-observability",
    "streamlit"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "pyspark==4.2.1",
    "delta-spark==3.2.0",
    "apache-airflow==2.10.0",
    "streamlit==1.44.1",
    "plotly==6.0.1",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "mcp==1.9.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://github.com/laasyaarun18-gif/Pipeline-System"
Documentation = "https://github.com/laasyaarun18-gif/Pipeline-System#readme"
Issues = "https://github.com/laasyaarun18-gif/Pipeline-System/issues"
Changelog = "https://github.com/laasyaarun18-gif/Pipeline-System/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
